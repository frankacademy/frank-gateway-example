routes:
  - name: to-kadaster
    id: 1
    uri: /kadaster
    upstream_id: upstream-kadaster
    status: 1
  - name: to-rotterdam
    id: 2
    uri: /rotterdam
    upstream_id: upstream-rotterdam
    status: 1

upstreams:
  - id: upstream-kadaster
    scheme: https
    pass_host: node
    nodes:
      "kadaster:443": 1
    tls:
      verify: true
      ca_certs:
        - "$ENV://CA_CRT"
      client_cert: "$ENV://CLIENT_CRT"
      client_key: "$ENV://CLIENT_KEY"
  - id: upstream-rotterdam
    scheme: https
    pass_host: node
    nodes:
      "rotterdam:9443": 1
    tls:
      verify: true
      ca_certs:
        - "$ENV://CA_CRT"
      client_cert: "$ENV://CLIENT_CRT"
      client_key: "$ENV://CLIENT_KEY"
#END
