services:
  gate:
    image: apache/apisix
    ports:
      - 80:9080
    networks:
      apisix:
    volumes:
      - ./gate/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./gate/apisix.yaml:/usr/local/apisix/conf/apisix.yaml
    environment:
      - APISIX_STAND_ALONE=true
  kadaster:
    image: nginx:alpine
    ports:
      - 8080:80
      - 8443:443
    networks:
      apisix:
    volumes:
      - ./kadaster/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./kadaster/certs:/etc/nginx/certs:ro
networks:
  apisix:
    driver: bridge
