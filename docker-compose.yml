services:
  gate:
    image: ghcr.io/wearefrank/frank-gateway:1.1.4
    entrypoint: 
      - /bin/sh
      - /entrypoint.sh
    ports:
      - 80:9080
    networks:
      apisix:
    volumes:
      - ./common/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./gate/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./common/entrypoint.sh:/entrypoint.sh:ro
    secrets:
      - CA_CRT
      - CLIENT_CRT
      - CLIENT_KEY
  rotterdam:
    image: ghcr.io/wearefrank/frank-gateway:1.1.4
    entrypoint: 
      - /bin/sh
      - /entrypoint.sh
    ports:
      - 7080:9080
      - 7443:9443
    networks:
      apisix:
    volumes:
      - ./common/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./rotterdam/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./common/entrypoint.sh:/entrypoint.sh:ro
    secrets:
      - CA_CRT
      - SERVER_CRT
      - SERVER_KEY
  rotterdam-impl:
    image: nginx:alpine
    networks:
      apisix:
    volumes:
      - ./rotterdam-impl/nginx.conf:/etc/nginx/conf.d/default.conf:ro
networks:
  apisix:
    driver: bridge
secrets:
  CA_CRT:
    file: ./common/ca.crt
  CLIENT_CRT:
    file: ./gate/certs/client.crt
  CLIENT_KEY:
    file: ./gate/certs/client.key
  SERVER_CRT:
    file: ./rotterdam/certs/server.crt
  SERVER_KEY:
    file: ./rotterdam/certs/server.key
