services:
  gate:
    image: ghcr.io/wearefrank/frank-gateway:1.1.0
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["/docker-entrypoint.sh", "docker-start"]
    ports:
      - 80:9080
    networks:
      apisix:
    volumes:
      - ./common/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./gate/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./common/entrypoint.sh:/entrypoint.sh:ro
    secrets:
      - source: ca-crt
        target: CA_CRT
      - source: gate-client-crt
        target: CLIENT_CRT
      - source: gate-client-key
        target: CLIENT_KEY
    environment:
      - APISIX_STAND_ALONE=true
  rotterdam:
    image: ghcr.io/wearefrank/frank-gateway:1.1.0
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["/docker-entrypoint.sh", "docker-start"]
    ports:
      - 7080:9080
      - 7443:9443
    networks:
      apisix:
    volumes:
      - ./common/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./rotterdam/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./common/entrypoint.sh:/entrypoint.sh:ro
    secrets:
      - source: ca-crt
        target: CA_CRT
      - source: rotterdam-server-crt
        target: SERVER_CRT
      - source: rotterdam-server-key
        target: SERVER_KEY
    environment:
      - APISIX_STAND_ALONE=true
  rotterdam-impl:
    image: nginx:alpine
    networks:
      apisix:
    volumes:
      - ./rotterdam-impl/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  kadaster:
    image: nginx:alpine
    ports:
      - 8080:80
      - 8443:443
    networks:
      apisix:
    volumes:
      - ./kadaster/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./kadaster/certs:/etc/nginx/certs:ro
      - ./common/ca.crt:/etc/nginx/ca/ca.crt:ro
networks:
  apisix:
    driver: bridge
secrets:
  ca-crt:
    file: ./common/ca.crt
  gate-client-crt:
    file: ./gate/certs/client.crt
  gate-client-key:
    file: ./gate/certs/client.key
  rotterdam-server-crt:
    file: ./rotterdam/certs/serverclient.crt
  rotterdam-server-key:
    file: ./rotterdam/certs/serverclient.key
