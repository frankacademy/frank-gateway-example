services:
  gate:
    image: apache/apisix
    entrypoint: ["/bin/sh", "/render-apisix.sh"]
    ports:
      - 80:9080
    networks:
      apisix:
    volumes:
      - ./gate/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./gate/apisix.template.yaml:/templates/apisix.yaml:ro
      - ./gate/render-apisix.sh:/render-apisix.sh:ro
      - ./gate/certs:/certs:ro
    environment:
      - APISIX_STAND_ALONE=true
  kadaster:
    image: nginx:alpine
    ports:
      - 8080:80
      - 8443:443
    networks:
      apisix:
    volumes:
      - ./kadaster/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./kadaster/certs:/etc/nginx/certs:ro
networks:
  apisix:
    driver: bridge
