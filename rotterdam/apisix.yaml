routes:
  - name: to-rotterdam-impl
    id: 1
    uri: /*
    upstream_id: upstream-rotterdam-impl
    status: 1

upstreams:
  - id: upstream-rotterdam-impl
    scheme: http
    nodes:
      "rotterdam-impl:80": 1

ssls:
  - id: 1
    snis:
      - rotterdam
    cert: "$ENV://SERVER_CRT"
    key: "$ENV://SERVER_KEY"
    client:
      ca: "$ENV://CA_CRT"
      depth: 2
#END
